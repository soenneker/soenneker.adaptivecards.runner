name: daily-automatic-update
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

env:
  ASPNETCORE_ENVIRONMENT: Production
  GH__TOKEN: ${{ github.token }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Generate from the official schema
        run: dotnet run --project src/Soenneker.AdaptiveCards.Runner --configuration Release -- --output artifacts/Generated
      - uses: actions/upload-artifact@v4
        with:
          name: adaptivecards-generated-dtos
          path: artifacts/Generated/
          if-no-files-found: error

