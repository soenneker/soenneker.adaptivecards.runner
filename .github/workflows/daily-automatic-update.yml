name: daily-automatic-update
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

env:
  ASPNETCORE_ENVIRONMENT: Production
  GH__TOKEN: ${{ secrets.GH__TOKEN }}
  GH__USERNAME: ${{ secrets.GH__USERNAME }}
  GIT__TOKEN: ${{ secrets.GIT__TOKEN }}
  GIT__NAME: ${{ secrets.GIT__NAME }}
  GIT__EMAIL: ${{ secrets.GIT__EMAIL }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Update the DTO repository from the latest schema
        run: dotnet run --project src/Soenneker.AdaptiveCards.Runner --configuration Release

